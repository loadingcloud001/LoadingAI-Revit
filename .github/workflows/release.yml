name: Release add-in

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    name: Pack (Revit ${{ matrix.revit }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: [2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore LoadingAI.sln -p:RevitVersion=${{ matrix.revit }}

      - name: Build
        run: dotnet build LoadingAI.sln -c Release -p:RevitVersion=${{ matrix.revit }} --no-restore -p:SkipCopyAddin=true -p:SkipHostPluginBuild=true -m:1

      - name: Assert no upstream key is compiled in
        shell: pwsh
        run: |
          if (Test-Path 'src/LoadingAI.Core/Llm/DefaultLlmKey.g.cs') {
            throw 'DefaultLlmKey.g.cs must not exist in a release build — the upstream key belongs in the gateway secret.'
          }

      - name: Pack zip
        shell: pwsh
        run: ./scripts/pack-addin.ps1 -RevitVersion ${{ matrix.revit }} -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: LoadingAI-Revit-${{ matrix.revit }}
          path: artifacts/LoadingAI-Revit-${{ matrix.revit }}.zip
          if-no-files-found: error

  setup:
    name: Setup exe
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: LoadingAI-Revit-*
          merge-multiple: true

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile LoadingAI-Setup.exe
        shell: pwsh
        run: |
          ./scripts/stage-setup.ps1 -Dist dist -Payload installer/payload
          $version = "0.5.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF.Substring("refs/tags/v".Length)
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing at $iscc" }
          & $iscc "/DMyAppVersion=$version" installer/LoadingAI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: LoadingAI-Setup
          path: artifacts/LoadingAI-Setup.exe
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [pack, setup]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
          body: |
            Download **LoadingAI-Setup.exe** and double-click it. No administrator rights.
            Close Revit first. Leave the detected Revit year checked.
            Needs [WebView2 Evergreen](https://developer.microsoft.com/microsoft-edge/webview2/) (already on Windows 11).
            The zip for one Revit year is the same add-in if you prefer to copy the files yourself.
