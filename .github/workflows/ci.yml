name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  web:
    name: Web pane (typecheck + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm run build` runs `tsc --noEmit` before `vite build`, so a type error
      # in the pane fails here instead of at release time.
      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

  gateway:
    name: Gateway (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node:sqlite requires Node >= 22.5 and the counter store is production code.
      - name: Test
        working-directory: gateway
        run: npm test

  build:
    name: Build (Revit ${{ matrix.revit }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: [2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore LoadingAI.sln -p:RevitVersion=${{ matrix.revit }}

      # Build the whole solution against each Revit API. Skip host plugin
      # copy/deploy side-effects in CI (they target %AppData%).
      - name: Build
        run: dotnet build LoadingAI.sln -c Release -p:RevitVersion=${{ matrix.revit }} --no-restore -p:SkipCopyAddin=true -p:SkipHostPluginBuild=true -m:1

  test:
    name: Test (Revit 2027 anchor)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      # Hosted windows-latest cannot start Revit.exe. LoadingAI.RevitTests
      # (NUnit / ricaun) is compiled in the build job but skipped here —
      # IsTestProject=false unless ForceRevitTests=true. Run in-Revit locally
      # against Revit 2027: see src/LoadingAI.RevitTests/README.md.
      - name: Test
        run: dotnet test src/LoadingAI.Tests/LoadingAI.Tests.csproj -c Release -p:RevitVersion=2027 -p:SkipCopyAddin=true -p:SkipHostPluginBuild=true -m:1

