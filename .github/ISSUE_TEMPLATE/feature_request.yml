name: Feature request
description: Suggest a tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do in Revit?
      description: Describe the task, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the add-in to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
